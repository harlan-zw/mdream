[package]
name = "rust-compare"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-compare"
path = "src/main.rs"

[dependencies]
mdream = { path = "../../crates/core" }
htmd = "0.5.5"
html2md = "0.2.17"
html2md-rs = "0.12.2"
mdka = "2.2.1"
html_to_markdown = "0.1.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
