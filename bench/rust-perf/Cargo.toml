[package]
name = "mdream-perf"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
alloc = []

[dependencies]
mdream = { path = "../../crates/core" }
libc = "0.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
