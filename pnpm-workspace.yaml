# pkg.pr.new monorepo previews use tarball URLs for sibling dependencies.
blockExoticSubdeps: false

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - confbox@0.3.1
  - '@nuxt/test-utils@4.3.2'
  - '@types/node@26.6.4 || 26.6.5'
  - miniflare@5.20261001.0-alpha
  - wrangler@4.146.0
  - '@napi-rs/cli@3.10.6'
  - vite@8.3.2
  - express@5.3.0
  - knip@6.41.0
  - '@nuxt/cli@4.0.1'
  - '@nuxt/kit@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  - '@nuxt/vite-server@4.6.1'
  - cssnano-preset-default@9.5.0
  - cssnano@9.5.0
  - nuxt@4.6.1
  - postcss-normalize-unicode@9.1.0
  - postcss-normalize-whitespace@9.0.7

trustPolicy: no-downgrade
# These versions predate npm provenance/trusted-publishing, while their newer
# releases publish with it, so no-downgrade flags them as trust downgrades.
# Both are long-standing, widely-audited packages (chokidar by paulmillr,
# semver by npm); the flag is a known false positive.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  # Exact exception for the requested Nuxt upgrade. Upstream release:
  # https://github.com/cssnano/cssnano/releases/tag/cssnano%409.5.0
  - cssnano@9.5.0
  - cssnano-preset-default@9.5.0
  - cssnano-utils@8.2.1
  - stylehacks@9.0.8
  - postcss-svgo@9.0.5
  - postcss-colormin@9.0.7
  - postcss-merge-rules@9.1.3
  - postcss-discard-empty@9.0.7
  - postcss-minify-params@9.0.7
  - postcss-normalize-url@9.0.6
  - postcss-convert-values@9.0.8
  - postcss-merge-longhand@9.3.0
  - postcss-ordered-values@9.0.8
  - postcss-reduce-initial@9.0.7
  - postcss-discard-comments@9.0.7
  - postcss-minify-gradients@9.0.7
  - postcss-minify-selectors@9.0.7
  - postcss-normalize-string@9.0.6
  - postcss-unique-selectors@9.0.6
  - postcss-normalize-charset@9.0.6
  - postcss-normalize-unicode@9.1.0
  - postcss-reduce-transforms@9.0.5
  - postcss-discard-duplicates@9.0.6
  - postcss-discard-overridden@9.0.6
  - postcss-minify-font-values@9.0.8
  - postcss-normalize-positions@9.0.7
  - postcss-normalize-whitespace@9.0.7
  - postcss-normalize-repeat-style@9.0.6
  - postcss-normalize-display-values@9.0.6
  - postcss-normalize-timing-functions@9.0.6

shellEmulator: true

packages:
  - packages/*
  - crates/node
  - crates/node/npm/*
  - crates/edge/test-worker
  - examples/*
  - '!examples/nextjs'

overrides:
  # fflate 0.8.3 emits a trailing empty Gunzip chunk that breaks
  # @arethetypeswrong/cli 0.18.2 tarball extraction (attw --pack crashes
  # with "Cannot read properties of undefined (reading 'filename')").
  fflate: 0.8.2

  nuxt-site-config: https://pkg.pr.new/harlan-zw/nuxt-site-config/nuxt-site-config@b8c8a6978ce818d77ecc50c679d412e748fdbdcb
  nuxt-site-config-kit: https://pkg.pr.new/harlan-zw/nuxt-site-config/nuxt-site-config-kit@b8c8a6978ce818d77ecc50c679d412e748fdbdcb
  nuxtseo-shared: https://pkg.pr.new/harlan-zw/nuxt-seo/nuxtseo-shared@226c091a0744b7286ef721ac035eed53856bfaa5
  site-config-stack: https://pkg.pr.new/harlan-zw/nuxt-site-config/site-config-stack@b8c8a6978ce818d77ecc50c679d412e748fdbdcb

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  vue-demi: false
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
  - better-sqlite3
  - sharp
  - vue-demi
  - workerd
  - maplibre-gl

