minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - confbox@0.3.1
  - '@types/node@26.6.4 || 26.6.5'
  - express@5.3.0
  - '@nuxt/cli@4.0.1'
  - '@nuxt/kit@4.6.1'
  - nuxtseo-shared@6.0.0

trustPolicy: no-downgrade
# semver 6.x predates npm provenance/trusted-publishing, while newer releases
# publish with it, so no-downgrade flags it as a trust downgrade. The flag is a
# known false positive for this long-standing, widely-audited package.
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - packages/*
  - crates/node
  - crates/node/npm/*
  - crates/edge/test-worker
  - examples/*
  - '!examples/nextjs'

overrides:
  # fflate 0.8.3 emits a trailing empty Gunzip chunk that breaks
  # @arethetypeswrong/cli 0.18.2 tarball extraction (attw --pack crashes
  # with "Cannot read properties of undefined (reading 'filename')").
  fflate: 0.8.2

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  vue-demi: false
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
  - better-sqlite3
  - sharp
  - vue-demi
  - workerd
  - maplibre-gl

catalog:
  '@actions/core': ^3.0.1
  '@actions/exec': ^3.0.0
  '@antfu/eslint-config': ^10.0.0
  '@arethetypeswrong/cli': ^0.18.5
  '@clack/prompts': ^1.8.1
  '@cloudflare/vitest-plugin': ^1.4.7
  # napi-build 2.4 links emnapi v2 exports; keep the runtime and archive aligned.
  '@emnapi/core': 2.0.0-alpha.6
  '@emnapi/runtime': 2.0.0-alpha.6
  '@emnapi/wasi-threads': ^2.2.0
  '@napi-rs/cli': ^3.10.9
  # Runtime 1.2.6 requires emnapi beta.2; keep the alpha.6 archive aligned.
  '@napi-rs/wasm-runtime': 1.2.5
  '@nuxt/devtools': 4.0.0-beta.7
  '@nuxt/kit': ^4.6.2
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': ^4.6.2
  '@nuxt/test-utils': ^4.3.4
  '@tybys/wasm-util': ^0.10.4
