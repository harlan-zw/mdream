  cross-env: ^10.1.0
  defu: ^6.1.7
  emnapi: 2.0.0-alpha.6
  eslint: ^10.13.0
  express: ^5.3.0
  hookable: ^6.1.2
  jsdom: ^30.1.3
  knip: ^6.43.0
  nitropack: 2.13.5
  nuxt: ^4.6.2
  nuxt-site-config: ^5.0.3
  nypm: ^0.6.11
  obuild: ^0.4.45
  ofetch: ^1.5.1
