name: Build wasi artifacts
description: napi wasi build, wasm-opt pass and staging into crates/node/npm. Shared by Test and Release so the two cannot drift.

inputs:
  target:
    description: wasi target triple to build
    required: false
    default: wasm32-wasip1-threads

runs:
  using: composite
  steps:
    - name: Build native module (wasm)
      working-directory: crates/node
      shell: bash
      run: pnpm exec napi build --target ${{ inputs.target }} --profile wasm

    - name: Install wasm-opt
      uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
      with:
        tool: wasm-opt

    - name: Optimize and stage wasi artifacts
      working-directory: crates/node
      shell: bash
      run: |
        # napi renames its wasm output between minor releases (3.7 emitted
        # rust.wasm, 3.8 emits rust.wasm32-wasi.wasm), so resolve the name from
        # the script that owns napi's naming rules rather than hardcoding it.
        wasm=$(node ./scripts/move-artifacts.mjs --print-release-wasm)
        echo "Optimizing $wasm"
        wasm-opt -Oz --all-features --converge --low-memory-unused "$wasm" -o "$wasm"
        node ./scripts/move-artifacts.mjs --require-wasm

    - name: Verify staged npm artifacts
      shell: bash
      run: node scripts/verify-npm-artifacts.mjs wasm32-wasi
