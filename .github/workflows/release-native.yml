name: Build Native

on:
  workflow_call:

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_napi_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            use_zigbuild: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            use_zigbuild: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-24.04
            use_napi_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-freebsd
            os: ubuntu-24.04
            use_zigbuild: true
          - target: aarch64-linux-android
            os: ubuntu-24.04
          - target: armv7-linux-androideabi
            os: ubuntu-24.04
          - target: wasm32-wasip1-threads
            os: ubuntu-24.04

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install zig
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-zigbuild

      - name: Setup Android NDK linkers
        if: contains(matrix.target, 'android')
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          if [[ "${{ matrix.target }}" == "aarch64-linux-android" ]]; then
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> $GITHUB_ENV
          elif [[ "${{ matrix.target }}" == "armv7-linux-androideabi" ]]; then
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates -> target

      - name: Build native module (zigbuild)
        if: matrix.use_zigbuild
        working-directory: crates/node
        run: pnpm exec napi build --platform --release --esm --target ${{ matrix.target
          }} -x

      - name: Build native module (napi-cross)
        if: matrix.use_napi_cross
        working-directory: crates/node
        run: pnpm exec napi build --platform --release --esm --target ${{ matrix.target
          }} --use-napi-cross

      # Build, wasm-opt and staging live in the composite action so the Test
      # workflow exercises this exact path on every PR.
      - name: Build wasi artifacts
        if: startsWith(matrix.target, 'wasm')
        uses: ./.github/actions/wasi-build
        with:
          target: ${{ matrix.target }}

      - name: Build native module
        if: ${{ !matrix.use_zigbuild && !matrix.use_napi_cross &&
          !startsWith(matrix.target, 'wasm') }}
        working-directory: crates/node
        run: pnpm exec napi build --platform --release --esm --target ${{ matrix.target
          }}

      - name: Move artifacts
        working-directory: crates/node
        run: node ./scripts/move-artifacts.mjs
        if: ${{ !startsWith(matrix.target, 'wasm') }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: |
            crates/node/npm/**/*.node
            crates/node/npm/**/*.wasm
            crates/node/npm/**/*.js
            crates/node/npm/**/*.cjs
            crates/node/npm/**/*.mjs
            crates/node/npm/**/*.d.ts
            crates/node/npm/**/*.d.cts
            crates/node/npm/**/*.d.mts
            !crates/node/npm/**/node_modules/**
          if-no-files-found: error

      - name: Upload NAPI loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-loader
          path: |
            crates/node/index.js
            crates/node/index.d.ts
          if-no-files-found: error

  build-wasm-edge:
    name: Build WASM Edge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates -> target

      - name: Install wasm-pack and wasm-opt
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: wasm-pack,wasm-opt

      - name: Build WASM edge module
        run: |
          node scripts/build-wasm-edge.mjs --target web --out-dir packages/mdream/wasm
          node scripts/build-wasm-edge.mjs --target bundler --out-dir packages/mdream/wasm-bundler

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-edge
          path: |
            packages/mdream/wasm/
            packages/mdream/wasm-bundler/
          if-no-files-found: error
