name: Update Bundle Stats

on:
  push:
    branches:
      - main
      - 1.x
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stats:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates -> target

      - name: Install wasm-pack and wasm-opt
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-pack,wasm-opt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: |
          pnpm test:bundle-size
          pnpm test:bundle-size:rust

      - name: Update stats
        run: node bench/bundle/update.ts

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # Repository rules require changes to main to go through a pull request.
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: bench/bundle/last.json
          base: ${{ github.ref_name }}
          commit-message: 'chore: update bundle stats [skip ci]'
          title: 'chore: update bundle stats'
          body: Automated bundle size stats update produced by the Update Bundle Stats workflow.
          branch: chore/update-bundle-stats
          delete-branch: true
