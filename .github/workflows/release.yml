name: Release

permissions:
  contents: write
  id-token: write
  packages: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume (for example, v1.5.2)
        required: true
        type: string

jobs:
  native:
    uses: ./.github/workflows/release-native.yml

  publish:
    runs-on: ubuntu-latest
    needs: [native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Force Set pnpm Registry
        run: pnpm config set registry https://registry.npmjs.org

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: '!*.dockerbuild'

      - name: Flatten native artifacts for napi
        run: node scripts/stage-napi-artifacts.mjs

      - name: Move WASM edge artifacts
        run: |
          mkdir -p packages/mdream/wasm
          mkdir -p packages/mdream/wasm-bundler
          cp -v artifacts/wasm-edge/wasm/* packages/mdream/wasm/
          cp -v artifacts/wasm-edge/wasm-bundler/* packages/mdream/wasm-bundler/

      - name: Generate NAPI index.js and move to npm dirs
        working-directory: crates/node
        run: pnpm exec napi artifacts

      - name: Verify every platform package has its binary
        # Publishing a platform package whose declared files are missing yields
        # an installable-but-broken npm release, so gate on it here.
        run: node scripts/verify-npm-artifacts.mjs

      - name: Copy NAPI entry files to distribution package
        run: |
          mkdir -p packages/mdream/napi
          cp crates/node/index.js packages/mdream/napi/index.mjs
          cp crates/node/index.d.ts packages/mdream/napi/index.d.ts
          cp crates/node/index.d.ts packages/mdream/napi/index.d.mts

      - name: Build publishable packages
        # Build before the idempotent publish checks: a resumed release may
        # skip @mdream/js and mdream, but @mdream/action still needs their
        # generated declarations when ncc bundles the action.
        run: pnpm --filter './packages/**' run build

      - name: Determine npm dist-tag
        id: dist-tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=--tag beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish platform packages
        run: |
          failed=""
          for pkg in crates/node/npm/*/; do
            if [ -f "$pkg/package.json" ]; then
              name=$(node -p "require('./$pkg/package.json').name")
              version=$(node -p "require('./$pkg/package.json').version")
              private=$(node -p "Boolean(require('./$pkg/package.json').private)")
              if [ "$private" = "true" ]; then
                echo "Skipping private platform package $name"
                continue
              fi
              # Idempotent on re-runs: skip versions that are already live.
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "Skipping $name@$version (already published)"
                continue
              fi
              # WASI bundles its runtime dependencies; pnpm requires the
              # hoisted linker while assembling that package for publish.
              PNPM_CONFIG_NODE_LINKER=hoisted pnpm publish --access public --no-git-checks --provenance ${{ steps.dist-tag.outputs.tag }} --filter "$name" || failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed to publish platform packages:$failed"
            exit 1
          fi

      - name: Publish all other packages
        run: |
          failed=""
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              name=$(node -p "require('./$pkg/package.json').name")
              version=$(node -p "require('./$pkg/package.json').version")
              private=$(node -p "Boolean(require('./$pkg/package.json').private)")
              if [ "$private" = "true" ]; then
                continue
              fi
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "Skipping $name@$version (already published)"
                continue
              fi
              pnpm publish --access public --no-git-checks --provenance ${{ steps.dist-tag.outputs.tag }} --filter "$name" || failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed to publish packages:$failed"
            exit 1
          fi

  docker:
    needs: [native]
    uses: ./.github/workflows/release-docker.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
