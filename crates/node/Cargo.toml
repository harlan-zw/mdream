[package]
name = "mdream-node"

version.workspace = true

edition.workspace = true

description = "NAPI bindings for mdream. Thin wrapper exposing the Rust engine to Node.js."

license.workspace = true

[lib]
crate-type = [ "cdylib" ]

[dependencies]
napi = { version = "3.14.0", default-features = false, features = [ "napi9" ] }
napi-derive = "3.6.10"
mdream = { path = "../core" }

[lints]
workspace = true

[build-dependencies]
napi-build = "2.6.0"
