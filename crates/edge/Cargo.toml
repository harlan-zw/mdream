[package]
name = "mdream-edge"

version.workspace = true

edition.workspace = true

description = "WebAssembly edge runtime bindings for mdream HTML-to-Markdown converter"

license.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false # wasm-pack's bundled wasm-opt is too old; run wasm-opt manually post-build

[lib]
crate-type = [ "cdylib" ]

[features]
# Test-only: makes `origin: "__mdream_panic_probe__"` panic so the Workers test
# can assert panic reporting against a real abort. Never enabled for releases.
panic-probe = [ ]

[dependencies]
mdream = { path = "../core" }
wasm-bindgen = "0.2.123"
js-sys = "0.3.100"

[lints]
workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3.73"
